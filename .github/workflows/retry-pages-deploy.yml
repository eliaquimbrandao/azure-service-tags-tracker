name: Retry failed Pages deploy

on:
  workflow_run:
    workflows:
      - pages build and deployment
      - pages-build-deployment
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest

    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          echo "Retrying failed jobs for Pages workflow run ${RUN_ID}"

          gh api \
            --method POST \
            "/repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"

          echo "Successfully requested rerun of failed jobs."
