name: Update Azure Service Tags

on:
  schedule:
    # Daily check. Microsoft publishes roughly weekly (Tue-Fri); the collector
    # exits without writing anything when the published file is unchanged.
    - cron: "17 5 * * *"

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      baseline_setup:
        description: "Setup initial baseline (first run)"
        required: false
        default: false
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-azure-service-tags
      cancel-in-progress: false
    permissions:
      contents: write # allow pushing branches
      pull-requests: write # allow opening PRs
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Self-checks (diff logic, counting helper, search)
        run: |
          set -euo pipefail
          python scripts/test_watcher.py
          node scripts/test-change-counts.mjs
          node scripts/test-search.mjs
          python scripts/test_tag_pages.py

      # continue-on-error so a failed collection is still recorded in
      # collection-log.json and committed; the last step fails the job.
      - name: Run Azure Service Tag Tracker
        id: watcher
        continue-on-error: true
        run: |
          set -euo pipefail
          BASELINE="${{ github.event.inputs.baseline_setup || 'false' }}"
          if [ "$BASELINE" = "true" ]; then
            echo "🎯 Setting up initial baseline - no changes will be recorded"
            python scripts/azure_watcher.py --baseline
          else
            echo "📊 Running regular update - detecting changes"
            python scripts/azure_watcher.py
          fi

      - name: Verify published data before committing
        if: steps.watcher.outcome == 'success'
        run: python scripts/verify_data.py

      - name: Build per-service-tag pages and sitemap
        if: steps.watcher.outcome == 'success'
        run: python scripts/build_tag_pages.py

      - name: Configure Git identity
        run: |
          git config --local user.email "eliaquimbrandao@users.noreply.github.com"
          git config --local user.name "Eliaquim Brandao"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create commit (if needed)
        id: commit_step
        run: |
          set -euo pipefail
          # A failed run skipped verification and may have left half-written
          # data, so publish only its failure record.
          if [ "${{ steps.watcher.outcome }}" = "failure" ]; then
            PATHS=(docs/data/collection-log.json)
          else
            PATHS=(docs/data docs/tag docs/sitemap.xml)
          fi
          CHANGES="$(git status --porcelain=v1 -- "${PATHS[@]}" || true)"
          if [ -z "$CHANGES" ]; then
            echo "No changes under ${PATHS[*]}; exiting early."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -- "${PATHS[@]}"
          BASELINE="${{ github.event.inputs.baseline_setup || 'false' }}"
          if [ "$BASELINE" = "true" ]; then
            MSG="📊 Establish Azure Service Tags baseline - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          else
            if [ "${{ steps.watcher.outcome }}" = "failure" ]; then
              MSG="⚠️ Record failed Azure Service Tags collection - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            else
              MSG="📈 Update Azure Service Tags data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            fi
          fi
          git commit -m "$MSG"
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      - name: Create branch and push
        if: steps.commit_step.outputs.did_commit == 'true'
        id: push_branch
        run: |
          set -euo pipefail
          BRANCH="data/update-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open and merge Pull Request
        if: steps.commit_step.outputs.did_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push_branch.outputs.branch_name }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "Automated data update: $BRANCH" \
            --body "This PR was opened by CI to merge the latest Azure Service Tags data in \`docs/data\`.")
          echo "Opened $PR_URL"

          # A PR that cannot be merged (ruleset, required review) stays open for
          # manual merge; that is not a failed collection.
          if gh pr merge "$PR_URL" --squash --subject "📈 Update Azure Service Tags data"; then
            # The data/* ruleset may forbid deletion; the data is merged either way.
            git push origin --delete "$BRANCH" \
              || echo "::warning::Merged, but could not delete branch $BRANCH."
          else
            echo "::warning::Could not auto-merge $PR_URL; merge it manually."
          fi

      - name: Fail the job if collection failed
        if: steps.watcher.outcome == 'failure'
        run: |
          echo "❌ Collection failed; the failure was recorded in docs/data/collection-log.json"
          exit 1
